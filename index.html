<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGGPH</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071b55;
  color:white;
}

header{
  height:70px;
  background:#092466;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#ffd700;
}

button{
  border:0;
  border-radius:22px;
  padding:10px 16px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  background:#163b91;
  color:white;
  border:1px solid #7894ff;
}

.register{
  background:#ffd700;
  color:#111;
  margin-left:5px;
}

.menu{
  background:#123477;
  padding:12px 20px;
  text-align:right;
  font-size:28px;
}

.hero{
  min-height:430px;
  padding:70px 20px;
  text-align:center;
  background:linear-gradient(#0b2b72,#071b55);
}

.hero h1{
  font-size:38px;
  margin:10px 0;
}

.hero p{
  font-size:18px;
}

.cta{
  margin-top:25px;
  background:white;
  color:#092466;
  font-size:17px;
}

section{
  padding:30px 20px;
  text-align:center;
}

.card{
  background:#102d70;
  padding:20px;
  margin:12px auto;
  max-width:400px;
  border-radius:15px;
}

footer{
  background:#102d70;
  padding:25px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div class="logo">GGGPH</div>

  <div>
    <button class="login" onclick="login()">Mag-Login</button>
    <button class="register" onclick="register()">Magrehistro</button>
  </div>
</header>

<div class="menu">☰</div>

<div class="hero">
  <h1>Welcome sa GGGPH</h1>
  <p>Maligayang pagdating sa aming website.</p>
  <button class="cta" onclick="register()">Gumawa ng Account</button>
</div>

<section>
  <h2>Welcome</h2>

  <div class="card">
    <h3>Account</h3>
    <p>Mag-register o mag-login para makapasok sa iyong demo account.</p>
  </div>

  <div class="card">
    <h3>Mobile Friendly</h3>
    <p>Dinisenyo para madaling gamitin sa cellphone.</p>
  </div>
</section>

<footer>
  © 2026 GGGPH
</footer>

<script>
function login(){
  alert("Login page ");
}

function register(){
  alert("Registration page");
}
</script>

</body>
</html>
