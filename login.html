<!DOCTYPE html><html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGGPH - Login</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #06165a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: #092675;
  border: 2px solid #e7bd20;
  border-radius: 25px;
  padding: 30px 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  color: #ffd21c;
  text-shadow: 2px 3px 2px #8b5200;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #d5dcff;
  margin-bottom: 28px;
}

label {
  display: block;
  margin: 15px 5px 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #6685d8;
  background: #102e78;
  color: white;
  font-size: 16px;
  outline: none;
}

input::placeholder {
  color: #b9c5ef;
}

input:focus {
  border-color: #ffd21c;
}

.login-btn {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 25px;
  background: #ffd21c;
  color: #111;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.login-btn:active {
  transform: scale(.98);
}

.register {
  text-align: center;
  margin-top: 22px;
  color: #d5dcff;
}

.register a {
  color: #ffd21c;
  font-weight: bold;
  text-decoration: none;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  background: #163b91;
}
</style></head><body><div class="login-box">  <div class="logo">GGGPH</div>  <div class="subtitle">
    Mag-login sa iyong account
  </div>  <form id="loginForm"><label for="username">Username</label>
<input
  type="text"
  id="username"
  placeholder="Ilagay ang username"
  required
>

<label for="password">Password</label>
<input
  type="password"
  id="password"
  placeholder="Ilagay ang password"
  required
>

<button type="submit" class="login-btn">
  MAG-LOGIN
</button>

  </form>  <div id="message" class="message"></div>  <div class="register">
    Wala pang account?
    <a href="register.html">Magrehistro</a>
  </div></div><script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (username === "" || password === "") {
    return;
  }

  // Demo login
  localStorage.setItem("gggph_logged_in", "true");
  localStorage.setItem("gggph_username", username);

  // Balik sa homepage
  window.location.href = "index.html";
});
</script></body>
</html>
