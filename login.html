<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGGPH - Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071b55;
  color: white;
}

.container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 380px;
  background: white;
  color: #111;
  padding: 30px 22px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.logo {
  text-align: center;
  color: #d4a900;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 25px;
}

h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 25px;
  background: #123477;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: #123477;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="login-box">

    <div class="logo">GGGPH</div>

    <h2>Mag-Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <a class="back" href="index.html">← Bumalik sa Home</a>

  </div>

</div>

<script>
function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if (!username || !password) {
    alert("Pakilagay ang username at password.");
    return;
  }

  alert("login successful!");
  window.location.href = "index.html";
}
</script>

</body>
</html>
